[project]
name = "filing-radar"
version = "0.1.0"
description = "Screens ITU BR IFIC issues for notices that may affect radio frequency use in Finland"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
    "py1546",
    "numpy>=2",
    "anthropic>=2.6.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
py1546 = { git = "https://github.com/eeveetza/Py1546", rev = "e235629009ab1a12a33fc4a8fb5612f2883ecb5b" }

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests", "scoring/tests"]
filterwarnings = [
    # Py1546 (reference code, unmodified) uses numpy.matrix; NumPy marks it pending deprecation
    "ignore:the matrix subclass is not the recommended way:PendingDeprecationWarning",
]
