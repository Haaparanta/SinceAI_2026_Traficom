[project]
name = "filing-radar"
version = "0.1.0"
description = "Screens ITU BR IFIC issues for notices that may affect radio frequency use in Finland"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=1.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests", "scoring/tests"]
