<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traficom Briefing Card</title>
<style>
  /* 🎀 Girlypop theme v2 tokens (subset of design/girlypop.css) */
  :root {
    --radius: 0.875rem;
    --background: oklch(0.985 0.008 350);
    --foreground: oklch(0.24 0.04 340);
    --card: oklch(1 0 0);
    --popover: oklch(1 0 0 / 0.8);
    --muted: oklch(0.96 0.015 350);
    --muted-foreground: oklch(0.52 0.03 340);
    --primary: oklch(0.57 0.2 352);
    --primary-foreground: oklch(0.99 0.005 350);
    --secondary: oklch(0.94 0.035 310);
    --secondary-foreground: oklch(0.32 0.08 310);
    --risk-high: oklch(0.94 0.04 20);
    --risk-high-foreground: oklch(0.46 0.17 25);
    --destructive: oklch(0.55 0.21 27);
    --success: oklch(0.45 0.11 160);
    --border: oklch(0.91 0.025 350);
    --ring: oklch(0.57 0.2 352);
    --gloss: linear-gradient(135deg, oklch(0.8 0.13 352), oklch(0.82 0.1 310));
    --shadow-soft: 0 1px 2px oklch(0.6 0.15 352 / 0.08), 0 8px 24px oklch(0.6 0.15 352 / 0.12);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --font-display: ui-rounded, "SF Pro Rounded", "Nunito", var(--font-sans);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: oklch(0.17 0.03 330);
      --foreground: oklch(0.96 0.015 350);
      --card: oklch(0.21 0.035 330);
      --popover: oklch(0.21 0.035 330 / 0.8);
      --muted: oklch(0.26 0.03 330);
      --muted-foreground: oklch(0.72 0.03 340);
      --primary: oklch(0.75 0.17 352);
      --primary-foreground: oklch(0.18 0.04 340);
      --secondary: oklch(0.3 0.06 310);
      --secondary-foreground: oklch(0.94 0.03 310);
      --risk-high: oklch(0.32 0.08 22);
      --risk-high-foreground: oklch(0.86 0.08 20);
      --destructive: oklch(0.68 0.2 20);
      --success: oklch(0.78 0.12 160);
      --border: oklch(1 0 0 / 0.1);
      --ring: oklch(0.75 0.17 352);
      --gloss: linear-gradient(135deg, oklch(0.6 0.15 352), oklch(0.55 0.1 310));
      --shadow-soft: 0 1px 2px oklch(0 0 0 / 0.3), 0 8px 24px oklch(0 0 0 / 0.35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--background); color: var(--foreground);
    font: 17px/24px var(--font-sans); -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 128px; }
  h1 { font: 700 28px/34px var(--font-display); letter-spacing: -0.01em; margin: 8px 0 4px; }
  .subtitle { color: var(--muted-foreground); font-size: 15px; margin: 0 0 16px; }
  h2 { font: 600 12px/16px var(--font-sans); color: var(--muted-foreground); text-transform: uppercase;
    letter-spacing: .08em; margin: 32px 0 12px; }
  .callout { background: var(--risk-high); color: var(--risk-high-foreground); border-left: 4px solid var(--destructive);
    border-radius: var(--radius); padding: 12px 16px; font-size: 15px; line-height: 21px; }
  .wedge { display: block; width: 100%; text-align: left; background: var(--card); color: var(--foreground);
    border: 2px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; font: inherit;
    cursor: pointer; box-shadow: var(--shadow-soft);
    transition: transform 220ms var(--ease-spring), border-color 200ms, background 200ms; }
  .wedge:active { transform: scale(0.98); }
  .wedge[aria-pressed="true"] { border-color: var(--primary); background: var(--secondary); color: var(--secondary-foreground); }
  .wedge b { display: block; font: 600 17px/22px var(--font-sans); margin-bottom: 4px; }
  .wedge span { font-size: 15px; line-height: 21px; opacity: .85; }
  .wedge .tag { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
    background: var(--primary); color: var(--primary-foreground); opacity: 1; vertical-align: 1px; }
  .q { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px;
    box-shadow: var(--shadow-soft); }
  .q label { display: block; font: 600 17px/22px var(--font-sans); margin-bottom: 4px; }
  .q small { display: block; color: var(--muted-foreground); font-size: 13px; line-height: 18px; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 72px; background: var(--muted); color: var(--foreground); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 12px; font: 16px/22px var(--font-sans); resize: vertical; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--popover); border-top: 1px solid var(--border);
    -webkit-backdrop-filter: blur(20px) saturate(1.4); backdrop-filter: blur(20px) saturate(1.4); }
  @supports not (backdrop-filter: blur(1px)) { .bar { background: var(--card); } }
  .cta { position: relative; overflow: hidden; display: block; width: 100%; max-width: 640px; min-height: 48px; margin: 0 auto;
    background: var(--primary); color: var(--primary-foreground); border: 0; border-radius: 999px; padding: 14px 20px;
    font: 600 17px/22px var(--font-sans); cursor: pointer; transition: transform 220ms var(--ease-spring); }
  .cta::after { content: ""; position: absolute; inset: 0; background: var(--gloss); opacity: 0; mix-blend-mode: soft-light;
    transition: opacity 200ms; }
  .cta:hover::after { opacity: .6; }
  .cta:active { transform: scale(0.97); }
  #status { text-align: center; color: var(--success); font-size: 13px; line-height: 18px; min-height: 18px; margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <h1>🎀 Traficom briefing card</h1>
  <p class="subtitle">Pick a wedge, capture answers, copy them back to Claude.</p>
  <p class="callout">🍒 Draft based on missing data: built from README.md only. All product ideas and questions are assumptions until the partner confirms. Answers are saved on this phone only.</p>

  <h2>Pick the wedge</h2>
  <button class="wedge" data-wedge="1" aria-pressed="true"><b>1 · Filing Radar <span class="tag">Recommended</span></b><span>Load a filing → see overlap with Finland's protected systems on one screen, ranked score, every flag cited, expert approves or dismisses.</span></button>
  <button class="wedge" data-wedge="2" aria-pressed="false"><b>2 · Circular Triage Agent</b><span>Data-light. Reads each ITU circular, triages filings against rules, tracks deadlines, drafts a memo for sign-off.</span></button>
  <button class="wedge" data-wedge="3" aria-pressed="false"><b>3 · Interference Screening Pipeline</b><span>Data-heavy. Ingests full filing data + diagrams, projects footprints over Finland, first-pass interference screening.</span></button>

  <h2>Top 10 questions</h2>
  <div id="questions"></div>
</main>
<div class="bar">
  <button id="copy" class="cta">Copy Partner Answers as Claude Update Prompt</button>
  <div id="status" role="status"></div>
</div>
<script>
  const QUESTIONS = [
    ["What data can we have tonight?", "Real ITU filings (SRS, .mdb/GXT, BR IFIC PDFs), a sample, or nothing? → Branch A vs B."],
    ["What are we protecting?", "List of Finnish assignments / earth stations / protected services to match against?"],
    ["Can the data go to cloud LLM APIs?", "Or must it stay on local / open-weight models?"],
    ["What does an expert produce today after a review?", "Memo, ITU comment/objection, coordination request, nothing?"],
    ["What on screen on Sunday separates 1st from 2nd?", "The single live action or metric evaluators judge."],
    ["How many filings per circular, and how many get a close look?", "Baseline for our time-saved metric."],
    ["Which parameters decide whether a filing matters?", "Band, service area, power, orbit, filing stage?"],
    ["Which sources do experts cross-check today?", "Radio Regulations, Finnish frequency plan, past correspondence, other DBs?"],
    ["Can you share one past real case (anonymised)?", "Becomes our golden demo sample."],
    ["What must the tool never do on its own?", "Guard rails: no auto-send, no silent dismissal, audit log?"]
  ];
  const KEY = "traficom-briefing-v1";
  let state = { wedge: "1", answers: {} };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) state = s; } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const box = document.getElementById("questions");
  QUESTIONS.forEach(([q, hint], i) => {
    const d = document.createElement("div"); d.className = "q";
    d.innerHTML = `<label for="a${i}">${i + 1}. ${q}</label><small>${hint}</small><textarea id="a${i}" placeholder="Partner's answer…"></textarea>`;
    box.appendChild(d);
    const ta = d.querySelector("textarea");
    ta.value = state.answers[i] || "";
    ta.addEventListener("input", () => { state.answers[i] = ta.value; save(); });
  });

  const wedges = document.querySelectorAll(".wedge");
  const paintWedges = () => wedges.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.wedge === state.wedge)));
  wedges.forEach(b => b.addEventListener("click", () => { state.wedge = b.dataset.wedge; save(); paintWedges(); }));
  paintWedges();

  document.getElementById("copy").addEventListener("click", async () => {
    const lines = QUESTIONS.map(([q], i) => `${i + 1}. ${q}\n   ANSWER: ${(state.answers[i] || "").trim() || "[no answer — keep as GAP - ASK PARTNER]"}`);
    const prompt = `Partner briefing answers from Traficom are in. Locked wedge: ${state.wedge}.\n\n` +
      `Update every file in ./pm_pack/: replace each matching [GAP - ASK PARTNER] and [HYPOTHESIS] with the confirmed answer, ` +
      `mark it [PARTNER CONFIRMED], remove the "missing data" warning only where every gap in that file is resolved, ` +
      `and list any architecture changes needed in 06_AGENTS_Master_Context.md.\n\n` + lines.join("\n");
    const status = document.getElementById("status");
    try { await navigator.clipboard.writeText(prompt); status.textContent = "Copied — paste it into Claude ✨"; }
    catch (e) {
      const t = document.createElement("textarea"); t.value = prompt; document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); status.textContent = "Copied — paste it into Claude ✨"; } catch (e2) { status.textContent = "Couldn't copy. Select the text and copy it manually."; }
      t.remove();
    }
    setTimeout(() => status.textContent = "", 2500);
  });
</script>
</body>
</html>
