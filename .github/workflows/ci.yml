# Checks every pull request and every push to main: the same gates as AGENTS.md "before every commit"
# (backend pytest, frontend build), plus frontend lint, workflow lint and a build of the deploy image.
# Deploying is deploy.yml's job; this workflow never touches Google Cloud.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    name: frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  workflows:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  image:
    name: deploy image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t filing-radar:ci .
      - name: smoke test
        run: |
          docker run -d --name app -p 8080:8080 filing-radar:ci
          for _ in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/api/issues > /dev/null
          curl -fsS localhost:8080/ | grep -q '<div id="root">'
