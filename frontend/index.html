<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filing Radar: ITU IFIC screening for Finland</title>
    <meta name="description" content="Filing Radar turns an ITU BR IFIC issue into a ranked, cited list of satellite and terrestrial notices that may affect radio frequency use in Finland, for expert review. Built for the Traficom challenge at Since AI 2026." />
    <link rel="canonical" href="https://filingradar.click/" />

    <!-- icons and install (files in frontend/public/) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#170a16" />
    <meta name="color-scheme" content="dark light" />
    <!-- dark by default, light only when chosen; applied before the first paint (same rule as src/theme.ts) -->
    <script>
      try {
        var t = localStorage.getItem("filing-radar.theme") === "light" ? "light" : "dark";
      } catch (e) { var t = "dark"; }
      document.documentElement.classList.toggle("dark", t === "dark");
      document.documentElement.style.colorScheme = t;
    </script>

    <!-- link previews (Open Graph, X/Twitter, Slack, Teams, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Filing Radar" />
    <meta property="og:title" content="Filing Radar: ITU IFIC screening for Finland" />
    <meta property="og:description" content="ITU IFIC notices that may affect radio frequency use in Finland, ranked and cited for expert review." />
    <meta property="og:url" content="https://filingradar.click/" />
    <meta property="og:image" content="https://filingradar.click/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Filing Radar logo, a radar sweep, beside the product name and the address filingradar.click" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Filing Radar: ITU IFIC screening for Finland" />
    <meta name="twitter:description" content="ITU IFIC notices that may affect radio frequency use in Finland, ranked and cited for expert review." />
    <meta name="twitter:image" content="https://filingradar.click/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Filing Radar",
        "url": "https://filingradar.click/",
        "description": "Screens ITU BR IFIC issues for satellite and terrestrial notices that may affect radio frequency use in Finland, with evidence for every finding and an indicative technical check.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "inLanguage": "en",
        "isAccessibleForFree": true
      }
    </script>
  </head>
  <body>
    <noscript>Filing Radar needs JavaScript to show the screening results.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
